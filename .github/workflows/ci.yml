name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gmail-mock:ci .
      - name: Smoke test
        run: |
          docker run -d --name gm -p 12411:12411 gmail-mock:ci
          for i in $(seq 1 30); do curl -sf http://localhost:12411/_mock/health && break; sleep 1; done
          curl -sf http://localhost:12411/gmail/v1/users/me/profile -H "Authorization: Bearer me@example.com"
          docker logs gm

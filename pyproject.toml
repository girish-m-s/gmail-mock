[project]
name = "gmail-mock"
version = "0.1.0"
description = "A stateful mock HTTP server that responds like the Gmail API, with Pub/Sub push notifications."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.scripts]
gmail-mock = "gmail_mock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
